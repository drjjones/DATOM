<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DATOM Figure Record</title>
  <meta name="description" content="A figure quoted in a claim, set beside the official figure for the same measure and period."/>
  <!-- This is a client rendered template (the record varies by ?id=), so a
       crawler that does not run JS sees only these static tags. They are
       generic and branded rather than per record.

       NOTHING in this file's static markup states an outcome, a lay line or a
       number. Every outcome word, every sentence about the outcome and every
       figure is rendered at runtime from GET /api/figure/{id}, and the
       sentences come from the lexicon snapshot the record itself carries, so a
       page can never keep saying something the record it describes has moved
       past. The shell has nothing to go stale. This is the discipline
       readiness.html follows.

       A figure is not a study. This page carries none of the vocabulary of the
       other DATOM record pages, and it never names who made the claim. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DATOM">
  <meta property="og:title" content="A figure checked against the official series">
  <meta property="og:description" content="The figure a claim quotes, beside the official figure for the same measure and period.">
  <meta property="og:image" content="https://datom.science/og/home.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A figure checked against the official series">
  <meta name="twitter:description" content="The figure a claim quotes, beside the official figure.">
  <meta name="twitter:image" content="https://datom.science/og/home.png">
  <link rel="canonical" id="canonical-link" href="https://datom.science/figure.html">
  <link rel="icon" type="image/svg+xml" href="./Assets/favicon.svg">
  <link rel="icon" type="image/png" href="./Assets/favicon.png">
  <link rel="apple-touch-icon" href="./Assets/favicon-180.png">
  <link rel="stylesheet" href="global.css?v=5">
  <link rel="stylesheet" href="elmer.css?v=20260719a">
  <link rel="stylesheet" href="tokens.css?v=1">
  <link rel="stylesheet" href="design-v1.1.css?v=9">
  <style>
    /* Page tokens only (tokens.css), so the site's own palette and type apply.
       The outcome chip is deliberately plain ink: no colour here may suggest
       that one outcome is better or worse than another. */
    .fig { max-width: 760px; }
    .fig [hidden] { display: none !important; }
    .fig-eyebrow { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 0 0 var(--s2); }
    .fig-claim { font-family: var(--font-display); font-size: 30px; line-height: 1.25; color: var(--ink); margin: 0 0 var(--s4); overflow-wrap: anywhere; }
    .fig-status { font-family: var(--font-data); font-size: 13px; color: var(--muted); line-height: 1.7; margin: var(--s4) 0; }

    .fig-outcome { margin: 0 0 var(--s5); }
    .fig-chip { display: inline-block; font-family: var(--font-data); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); border: 1px solid var(--ink); padding: 3px 8px; margin: 0 0 var(--s2); }
    .fig-line { font-family: var(--font-display); font-size: 19px; line-height: 1.45; color: var(--ink); margin: 0; }
    .fig-detail { font-size: 15px; line-height: 1.55; color: var(--muted); margin: var(--s2) 0 0; }

    .fig-compare { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); margin: 0 0 var(--s2); }
    .fig-compare.single { grid-template-columns: 1fr; }
    .fig-cell { padding: var(--s4) var(--s4) var(--s5); border-right: 1px solid var(--line); min-width: 0; }
    .fig-cell:last-child { border-right: none; }
    .fig-cell-label { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 0 0 var(--s3); }
    .fig-num { font-family: var(--font-display); font-size: 38px; line-height: 1.1; color: var(--ink); margin: 0 0 var(--s2); overflow-wrap: anywhere; }
    .fig-cap { font-size: 14px; line-height: 1.45; color: var(--muted); margin: 0 0 2px; }
    .fig-cap.small { font-size: 12px; color: var(--faint); }
    .fig-diff { font-family: var(--font-data); font-size: 13px; color: var(--ink); margin: 0 0 var(--s5); }

    .fig-sec { margin: var(--s6) 0; }
    .fig-sec h2 { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 0 0 var(--s3); font-weight: 500; }
    .fig-sec p { font-size: 15px; line-height: 1.6; color: var(--ink); margin: 0 0 var(--s2); }
    .fig-rows { display: grid; grid-template-columns: var(--label-col) 1fr; gap: 0; margin: 0; border-top: 1px solid var(--line); }
    .fig-rows dt, .fig-rows dd { margin: 0; padding: var(--s2) 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
    .fig-rows dt { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); padding-right: var(--s3); padding-top: 11px; }
    .fig-rows dd { color: var(--ink); overflow-wrap: anywhere; }
    .fig-flag { display: inline-block; margin-left: var(--s2); font-family: var(--font-data); font-size: 11px; letter-spacing: 0.04em; color: var(--ink); border: 1px solid var(--line-2); padding: 1px 6px; }
    .fig-related { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .fig-related li { padding: var(--s3) 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; color: var(--ink); }
    .fig-related .tag { display: block; font-family: var(--font-data); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin: 0 0 2px; }
    .fig-source { font-size: 14px; color: var(--muted); margin: var(--s5) 0 0; }
    .fig-source a, .fig-sec a { color: var(--signal); text-decoration: none; border-bottom: 1px solid var(--signal); }
    .fig-meta { font-family: var(--font-data); font-size: 11px; line-height: 1.8; color: var(--faint); margin: var(--s5) 0 0; overflow-wrap: anywhere; }

    @media (max-width: 560px) {
      .fig-claim { font-size: 24px; }
      .fig-compare { grid-template-columns: 1fr; }
      .fig-cell { border-right: none; border-bottom: 1px solid var(--line); }
      .fig-cell:last-child { border-bottom: none; }
      .fig-rows { grid-template-columns: 1fr; }
      .fig-rows dt { border-bottom: none; padding-bottom: 0; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html"><img src="./Assets/logo.png" class="header-logo" alt="DATOM"></a>
  <button class="menu-toggle" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <nav>
    <a href="record.html">Example</a>
    <a href="product.html">How it works</a>
    <a href="organizations.html">For Organizations</a>
    <a href="pricing.html">Work with DATOM</a>
    <a href="/app/login" class="btn-login">Sign in</a>
  </nav>
</header>

<main>
  <section class="fig">
    <p class="fig-eyebrow" id="fig-eyebrow">Figure record</p>
    <div class="fig-status" id="fig-status" role="status" aria-live="polite">Loading this record.</div>
    <noscript><p class="fig-status">This page needs JavaScript to show the record.</p></noscript>
    <div id="fig-content" hidden></div>
  </section>
</main>

<script>
(function () {
  var API = 'https://ebv5sdivvc.execute-api.us-east-1.amazonaws.com';
  var POLL_MS = 2000;
  var POLL_MAX_MS = 60000;

  var id = new URLSearchParams(location.search).get('id') || '';
  var statusEl = document.getElementById('fig-status');
  var content = document.getElementById('fig-content');

  // ── small helpers. Record text only ever enters the page through
  //    textContent. The two links take an href from the record, and only
  //    after it has been checked to start with https://. ────────────────────
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function safeUrl(u) { return typeof u === 'string' && /^https:\/\//.test(u); }
  function link(url, text) {
    var a = el('a', null, text);
    a.setAttribute('href', url);
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');
    return a;
  }
  function say(msg) { statusEl.textContent = msg; statusEl.hidden = false; }

  // A number as the reader would write it: grouped digits, at most four
  // decimals, and never a nonzero value shown as zero.
  function fmt(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '';
    var s = n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    if (n !== 0 && /^-?0$/.test(s)) s = String(Number(n.toPrecision(2)));
    return s;
  }

  var SCALE = { thousand: 1e3, million: 1e6, billion: 1e9, trillion: 1e12 };
  // How the claim's own unit reads. The series' unit is shown separately,
  // exactly as the agency publishes it.
  var UNIT_LABEL = {
    percent: 'percent', points: 'percentage points', count: 'count',
    currency: 'currency amount', rate: 'rate', ratio: 'ratio', other: ''
  };
  var PROVIDER_NAME = {
    BLS: 'BLS, U.S. Bureau of Labor Statistics',
    FRED: 'FRED, Federal Reserve Bank of St. Louis',
    CENSUS: 'U.S. Census Bureau',
    FBI_CDE: 'FBI Crime Data Explorer',
    CDC: 'CDC, Centers for Disease Control and Prevention',
    WORLD_BANK: 'World Bank',
    OWID: 'Our World in Data',
    EUROSTAT: 'Eurostat',
    BEA: 'BEA, U.S. Bureau of Economic Analysis'
  };
  function providerName(p) { return PROVIDER_NAME[p] || String(p || ''); }

  function periodText(from, to) { return from ? from + ' to ' + to : String(to); }

  function fail(msg) {
    content.hidden = true;
    say(msg);
  }

  function render(rec) {
    var spec = rec.figureSpec || {};
    var lex = rec.lexicon || {};
    var outcomeLines = lex.outcomeLines || {};
    var notCheckableLines = lex.notCheckableLines || {};
    var series = rec.series || null;
    var official = rec.official || null;
    var comparison = rec.comparison || null;

    // The comparison runs in the claim's own units. A scale word (million,
    // billion) applies to counts and amounts but never to a percent figure.
    var isPct = spec.statedUnit === 'percent' || spec.statedUnit === 'points';
    var scaleWord = (!isPct && spec.statedScale && SCALE[spec.statedScale]) ? spec.statedScale : '';
    var scaleDiv = scaleWord ? SCALE[scaleWord] : 1;
    var unitLabel = UNIT_LABEL[spec.statedUnit] || '';
    function figureText(n) { return fmt(n / scaleDiv) + (scaleWord ? ' ' + scaleWord : ''); }

    // The title is built from the claim, never from an outcome word.
    document.title = rec.claimAsStated + ' · Figure Record';
    var canon = document.getElementById('canonical-link');
    if (canon) canon.href = 'https://datom.science/figure.html?id=' + encodeURIComponent(rec.figureId);
    document.getElementById('fig-eyebrow').textContent = 'Figure record · ' + rec.figureId;

    content.textContent = '';

    // ── the claim as stated ───────────────────────────────────────────────
    content.appendChild(el('h1', 'fig-claim', rec.claimAsStated));

    // ── the outcome: its word and its lay line, both read from the record ─
    var out = el('div', 'fig-outcome');
    var word = String(rec.outcome || '').toLowerCase().replace(/_/g, ' ');
    if (word) out.appendChild(el('span', 'fig-chip', word.charAt(0).toUpperCase() + word.slice(1)));
    var line = rec.outcome === 'NOT_CHECKABLE'
      ? notCheckableLines[rec.notCheckableReason]
      : outcomeLines[rec.outcome];
    if (line) out.appendChild(el('p', 'fig-line', line));
    if (rec.outcome === 'NOT_CHECKABLE' && rec.notCheckableDetail) {
      out.appendChild(el('p', 'fig-detail', rec.notCheckableDetail));
    }
    content.appendChild(out);

    // ── stated figure beside the official figure ──────────────────────────
    var grid = el('div', 'fig-compare');

    var cellA = el('div', 'fig-cell');
    cellA.appendChild(el('p', 'fig-cell-label', 'The claim states'));
    cellA.appendChild(el('p', 'fig-num', fmt(spec.statedValue) + (spec.statedScale ? ' ' + spec.statedScale : '')));
    if (unitLabel) cellA.appendChild(el('p', 'fig-cap', unitLabel));
    if (spec.direction === 'increase') cellA.appendChild(el('p', 'fig-cap small', 'Stated as an increase'));
    if (spec.direction === 'decrease') cellA.appendChild(el('p', 'fig-cap small', 'Stated as a decrease'));
    grid.appendChild(cellA);

    if (official && series) {
      var cellB = el('div', 'fig-cell');
      cellB.appendChild(el('p', 'fig-cell-label', 'The official series shows'));
      cellB.appendChild(el('p', 'fig-num', figureText(official.figure)));
      if (unitLabel) cellB.appendChild(el('p', 'fig-cap', unitLabel));
      cellB.appendChild(el('p', 'fig-cap', series.measure));
      cellB.appendChild(el('p', 'fig-cap small', providerName(series.provider)));
      grid.appendChild(cellB);
    } else {
      grid.className += ' single';
    }
    content.appendChild(grid);

    if (comparison && typeof comparison.differencePoints === 'number') {
      var diffUnit = isPct ? 'percentage points' : (scaleWord || unitLabel);
      content.appendChild(el('p', 'fig-diff',
        'Difference: ' + fmt(comparison.differencePoints / scaleDiv) + (diffUnit ? ' ' + diffUnit : '')));
    }

    // ── the facts behind the two figures ──────────────────────────────────
    var rows = el('dl', 'fig-rows');
    function row(label, node) {
      rows.appendChild(el('dt', null, label));
      var dd = el('dd');
      if (typeof node === 'string') dd.textContent = node; else dd.appendChild(node);
      rows.appendChild(dd);
      return dd;
    }

    if (spec.periodUsed && spec.periodUsed.to) {
      var pdd = row('Period', periodText(spec.periodUsed.from, spec.periodUsed.to));
      // Marked whenever the claim did not name its own period.
      if (spec.periodSource !== 'stated') pdd.appendChild(el('span', 'fig-flag', 'default: latest available'));
    } else if (spec.periodStated && spec.periodStated.text) {
      row('Period named in the claim', spec.periodStated.text);
    }

    if (series) {
      row('Series', series.measure);
      row('Unit as published', series.unit);
    }

    if (official) {
      var how;
      if (official.mode === 'pct_change') how = 'Percent change in the series from ' + periodText(null, official.periodFrom) + ' to ' + official.periodTo;
      else if (official.mode === 'abs_change') how = 'Change in the series from ' + periodText(null, official.periodFrom) + ' to ' + official.periodTo;
      else if (official.mode === 'growth_value') how = 'The rate the series itself publishes for ' + official.periodTo;
      else how = 'The series value for ' + official.periodTo;
      row('Official figure is', how);

      var unitTail = series ? ' (' + series.unit + ')' : '';
      var published = (official.valueFrom !== null && official.valueFrom !== undefined && (official.mode === 'pct_change' || official.mode === 'abs_change'))
        ? fmt(official.valueFrom) + ' to ' + fmt(official.valueTo) + unitTail
        : fmt(official.valueTo) + unitTail;
      row('Published value', published);

      var vintage = String(official.vintage || '');
      if (official.vintageSource === 'fetchedAt') vintage += ' (the day DATOM read the series)';
      row('Vintage', vintage);
      row('Retrieved', String(official.retrievedAt || '').replace('T', ' ').replace('Z', ' UTC'));
    }
    if (rows.childNodes.length) content.appendChild(rows);

    // ── the definition, with its source link ─────────────────────────────
    if (series && series.definition) {
      var defSec = el('div', 'fig-sec');
      defSec.appendChild(el('h2', null, 'What the series measures'));
      defSec.appendChild(el('p', null, series.definition));
      if (safeUrl(series.definitionSource)) {
        var dp = el('p');
        dp.appendChild(link(series.definitionSource, 'Definition at the source'));
        defSec.appendChild(dp);
      }
      content.appendChild(defSec);
    }

    // ── siblings noted ────────────────────────────────────────────────────
    // A sibling note carries its own series, period and official figure. When
    // the claim's figure matches a sibling or another period, the comparison
    // names it (comparison.misframed) and that match is listed too.
    var related = [];
    var seen = {};
    (rec.siblingsNoted || []).forEach(function (s) {
      if (!s || !s.series || !s.official) return;
      var key = s.series.seriesKey + '|' + s.periodTo + '|' + s.official.figure;
      seen[key] = true;
      related.push({
        tag: 'Related series', measure: s.series.measure,
        period: periodText(s.periodFrom, s.periodTo), figure: s.official.figure
      });
    });
    var m = comparison && comparison.misframed;
    if (m && !seen[m.seriesKey + '|' + m.periodTo + '|' + m.figure]) {
      related.push({
        tag: m.kind === 'other_period' ? 'Same series, different period, matches the claim' : 'Related series that matches the claim',
        measure: m.measure, period: periodText(m.periodFrom, m.periodTo), figure: m.figure
      });
    }
    if (related.length) {
      var relSec = el('div', 'fig-sec');
      relSec.appendChild(el('h2', null, 'Related figures'));
      var ul = el('ul', 'fig-related');
      related.forEach(function (r) {
        var li = el('li');
        li.appendChild(el('span', 'tag', r.tag));
        li.appendChild(document.createTextNode(
          r.measure + ', ' + r.period + ': ' + figureText(r.figure) + (unitLabel ? ' ' + unitLabel : '')));
        ul.appendChild(li);
      });
      relSec.appendChild(ul);
      content.appendChild(relSec);
    }

    // ── one line of source attribution ────────────────────────────────────
    if (series) {
      var src = el('p', 'fig-source', 'Source: ');
      var name = providerName(series.provider);
      if (safeUrl(series.definitionSource)) src.appendChild(link(series.definitionSource, name));
      else src.appendChild(document.createTextNode(name));
      content.appendChild(src);
    }

    // ── provenance ────────────────────────────────────────────────────────
    var meta = 'Record ' + rec.figureId + ', version ' + rec.version + '.';
    if (rec.supersedes) meta += ' It replaces version ' + rec.supersedes + '.';
    if (rec.createdAt) meta += ' Checked ' + String(rec.createdAt).slice(0, 10) + '.';
    if (rec.integrity && rec.integrity.recordHash) meta += ' Record hash ' + String(rec.integrity.recordHash).slice(0, 16) + '.';
    content.appendChild(el('p', 'fig-meta', meta));

    statusEl.hidden = true;
    content.hidden = false;
  }

  if (!/^F-[0-9a-f]{16}$/.test(id)) {
    fail('That is not a figure record id.');
    return;
  }

  // The check runs after the answer box has already sent the reader here, so a
  // 404 at first means "not written yet", not "no such record". Poll every two
  // seconds for up to a minute.
  var startedAt = Date.now();
  say('Checking against the official series.');

  function poll() {
    fetch(API + '/api/figure/' + encodeURIComponent(id))
      .then(function (r) {
        if (r.status === 404) {
          if (Date.now() - startedAt >= POLL_MAX_MS) {
            fail('The check did not finish. Try again in a minute.');
          } else {
            setTimeout(poll, POLL_MS);
          }
          return null;
        }
        if (!r.ok) throw new Error('load');
        return r.json();
      })
      .then(function (rec) {
        if (!rec) return;
        if (!rec || typeof rec !== 'object' || rec.figureId !== id || typeof rec.claimAsStated !== 'string') throw new Error('load');
        render(rec);
      })
      .catch(function () { fail('Could not load this record right now.'); });
  }
  poll();
})();
</script>
