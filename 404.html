  <script>
    // GitHub Pages SPA redirect for /app/* routes: encode the path into a query
    // param and hand off to the dashboard's own router. Runs before render, so a
    // real /app deep link never sees the fallback body below.
    var path = window.location.pathname;
    if (path.startsWith('/app')) {
      window.location.replace(
        '/app/index.html?p=' + encodeURIComponent(path.slice(4) + window.location.search + window.location.hash)
      );
    }
  </script>
