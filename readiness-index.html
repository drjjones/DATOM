<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DATOM Readiness Records</title>
  <meta name="description" content="Public readiness records: how far along the chain of testing each claim has actually got, and where that chain stops today."/>
  <!-- Client-rendered index. As with readiness.html, nothing in this static
       shell states a readiness status: the list is fetched at runtime and every
       word describing a record comes from that record's own JSON. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DATOM">
  <meta property="og:title" content="DATOM Readiness Records">
  <meta property="og:description" content="How far along the chain of testing each claim has actually got.">
  <meta property="og:image" content="https://datom.science/og/home.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DATOM Readiness Records">
  <meta name="twitter:description" content="How far along the chain of testing each claim has actually got.">
  <meta name="twitter:image" content="https://datom.science/og/home.png">
  <link rel="canonical" href="https://datom.science/readiness-index.html">
  <link rel="icon" type="image/svg+xml" href="./Assets/favicon.svg">
  <link rel="icon" type="image/png" href="./Assets/favicon.png">
  <link rel="stylesheet" href="global.css?v=5">
  <style>
    .rr-wrap { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }
    .rr-lede { font-size: 1rem; line-height: 1.65; opacity: .8; margin: 0 0 30px; }
    .rr-item { display: block; padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,.1); text-decoration: none; color: inherit; }
    .rr-item:hover { opacity: .82; }
    /* The CLAIM leads. It is the only thing that tells a reader what the record
       is about, and it is what they are scanning for. */
    .rr-item-claim { font-size: 1rem; font-weight: 600; line-height: 1.45; margin: 0 0 10px; }
    /* A six-segment strip standing in for the ladder. Filled to the boundary,
       empty above. In a list of twenty records the prose lay headlines are
       near-identical and unscannable; the strip is readable at a glance and
       needs no reading at all. */
    .rr-strip { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 10px; }
    .rr-seg { width: 20px; height: 6px; border-radius: 1px; background: rgba(255,255,255,.13); }
    .rr-seg.on { background: #00D4FF; }
    .rr-seg.na { background: repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 3px, transparent 3px 6px); }
    .rr-pos { font-size: .8rem; opacity: .78; vertical-align: middle; }
    .rr-item-meta { font-size: .74rem; opacity: .45; margin: 8px 0 0; }
    .rr-tag { display: inline-block; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
              border: 1px solid rgba(255,255,255,.18); border-radius: 3px; padding: 1px 6px; margin-left: 8px; opacity: .75; }
    .rr-empty { font-size: .92rem; opacity: .65; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="rr-wrap">
    <h1>Readiness records</h1>
    <p class="rr-lede">
      Each record follows one public claim up a ladder of six testing steps and marks the step where the
      evidence actually stops. It does not score how strong the evidence is.
    </p>
    <div id="rr-loading">Loading...</div>
    <div id="rr-error" hidden></div>
    <div id="rr-list" hidden></div>
  </div>

<script>
(function () {
  var API = 'https://ebv5sdivvc.execute-api.us-east-1.amazonaws.com';
  var loading = document.getElementById('rr-loading');
  var errorEl = document.getElementById('rr-error');
  var list = document.getElementById('rr-list');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  fetch(API + '/api/record/RR-index')
    .then(function (r) {
      if (!r.ok) throw new Error('Could not load the record list right now.');
      return r.json();
    })
    .then(function (body) {
      var entries = (body && body.entries) || [];
      loading.hidden = true;
      if (!entries.length) {
        // An empty corpus is a real, honest state, not an error.
        list.innerHTML = '<p class="rr-empty">No readiness records have been published yet.</p>';
        list.hidden = false;
        return;
      }
      var ORDER = ['D1', 'D2', 'D3', 'D4', 'D5', 'D6'];

      list.innerHTML = entries.map(function (e) {
        var reached = e.boundaryRung ? ORDER.indexOf(e.boundaryRung) + 1 : 0;
        var strip = '', i;
        for (i = 0; i < ORDER.length; i++) {
          // A claim that is not testable as stated has no ladder position at
          // all, so its strip is hatched rather than empty: "not applicable"
          // and "nothing reached yet" are different statements about a record.
          strip += '<span class="rr-seg' + (!e.d0Passed ? ' na' : (i < reached ? ' on' : '')) + '"></span>';
        }
        var position = !e.d0Passed
          ? 'Too vague to test as stated'
          : (reached > 0
              ? 'Evidence stops at step ' + reached + ' of ' + ORDER.length
              : 'No step reached yet');

        return '<a class="rr-item" href="/readiness.html?id=' + esc(e.recordId) + '">' +
          '<p class="rr-item-claim">' + esc(e.claimStatement || e.recordId) + '</p>' +
          '<div><span class="rr-strip">' + strip + '</span>' +
          '<span class="rr-pos">' + esc(position) + '</span>' +
          (e.domain ? '<span class="rr-tag">' + esc(e.domain) + '</span>' : '') + '</div>' +
          '<p class="rr-item-meta">' + esc(e.recordId) +
          (e.publishedAt ? ' · ' + esc(String(e.publishedAt).slice(0, 10)) : '') + '</p>' +
        '</a>';
      }).join('');
      list.hidden = false;
    })
    .catch(function (e) {
      loading.hidden = true;
      errorEl.textContent = e.message || 'Could not load the record list right now.';
      errorEl.hidden = false;
    });
})();
</script>
</body>
</html>
